name: shellcheck

on:
  push:
    paths:
      - '**.sh'
      - '**.yml'
      - '**.yaml'
      - '.github/workflows/**'
  pull_request:
    paths:
      - '**.sh'
      - '**.yml'
      - '**.yaml'
      - '.github/workflows/**'

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run ShellCheck on our own scripts (strict)
        run: shellcheck main.sh install_openvpn.sh tools/*.sh .github/scripts/*.sh

      - name: Run ShellCheck on wireguard-install.sh (error only)
        run: shellcheck --severity=error wireguard-install.sh

  config-test:
    name: Config validation (ocserv)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install ocserv
        run: |
          sudo apt-get update
          sudo apt-get install -y ocserv

      - name: Validate generated ocserv config with ocserv --test-config
        run: |
          set -euo pipefail
          bash tools/ocserv.sh print-config > /tmp/ocserv-test.conf
          echo "--- generated ocserv.conf ---"
          cat /tmp/ocserv-test.conf
          sudo mkdir -p /etc/ocserv/ssl
          sudo openssl req -x509 -nodes -newkey rsa:2048 -days 30 \
            -keyout /etc/ocserv/ssl/server-key.pem \
            -out  /etc/ocserv/ssl/server-cert.pem \
            -subj "/CN=vpn.local"
          sudo touch /etc/ocserv/ocpasswd
          sudo mkdir -p /run
          set -o pipefail
          rc=0
          out="$(sudo ocserv -c /tmp/ocserv-test.conf --test-config 2>&1)" || rc=$?
          echo "$out"
          if [[ "$rc" -ne 0 ]]; then
            echo "::error::ocserv --test-config exited with code $rc"
            exit 1
          fi
          if echo "$out" | grep -qi 'unknown option'; then
            echo "::error::ocserv --test-config reported an unknown option"
            exit 1
          fi
          echo "ocserv config validated (exit 0, no unknown options)."

  pptp-dryrun:
    name: PPTP dry-run + availability check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check pptpd availability on this release
        run: |
          set -euo pipefail
          bash tools/pptp.sh print-config | tee /tmp/pptp-dryrun.txt
          grep -q 'option /etc/ppp/pptpd-options' /tmp/pptp-dryrun.txt \
            || { echo "::error::pptpd.conf missing the option directive"; exit 1; }
          grep -q 'require-mppe-128' /tmp/pptp-dryrun.txt \
            || { echo "::error::ppp options missing require-mppe-128"; exit 1; }
          grep -q 'require-mschap-v2' /tmp/pptp-dryrun.txt \
            || { echo "::error::ppp options missing require-mschap-v2"; exit 1; }
          grep -q 'localip' /tmp/pptp-dryrun.txt \
            || { echo "::error::pptpd.conf missing localip"; exit 1; }
          if apt-cache show pptpd >/dev/null 2>&1; then
            echo "pptpd is available on this release."
          else
            echo "::warning::pptpd is not available on this release (expected on Ubuntu 24.04+)."
            echo "The install path will refuse on this release; print-config still validated."
          fi
          echo "PPTP print-config validated."

  l2tp-validate:
    name: L2TP/IPsec config validator (real software)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Report OS + strongSwan package policy
        run: |
          set -euo pipefail
          echo "=== /etc/os-release ==="
          cat /etc/os-release
          sudo apt-get update
          echo "=== apt-cache policy ==="
          apt-cache policy strongswan strongswan-starter strongswan-swanctl charon-systemd xl2tpd ppp

      - name: Install strongswan-starter (explicit) + xl2tpd + ppp
        run: |
          set -euo pipefail
          # Same package set as tools/l2tp.sh (L2TP_PACKAGES). Do NOT rely on
          # the `strongswan` metapackage: on Ubuntu 26.04 it resolves to
          # charon-systemd + swanctl and installs no starter.
          sudo apt-get install -y strongswan-starter strongswan-charon xl2tpd ppp
          echo "=== installed strongSwan packages ==="
          dpkg-query -W -f='${Package} ${Version} ${db:Status-Abbrev}\n' 'strongswan*' 'charon*' 2>/dev/null \
              | awk '$3 ~ /^ii/ {print $1, $2}' || true

      - name: Validate generated configs with the real starter + xl2tpd
        run: bash .github/scripts/l2tp-validate.sh

  l2tp-os-matrix:
    # Authoritative package/support check for the README table. Each release
    # runs in its official Docker image, so the result comes from that
    # release's own apt indexes (no ad-hoc Packages downloads, no curl).
    name: L2TP OS matrix (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ['ubuntu:22.04', 'ubuntu:24.04', 'ubuntu:26.04', 'debian:12', 'debian:13']
    container:
      image: ${{ matrix.image }}
    env:
      DEBIAN_FRONTEND: noninteractive
      ROW: /tmp/l2tp-matrix-row.env
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: apt-get update, apt-cache policy, apt-cache depends strongswan
        id: policy
        run: |
          set -euo pipefail
          . /etc/os-release
          echo "=== ${PRETTY_NAME} (${VERSION_CODENAME:-?}) ==="
          apt-get update
          echo "=== apt-cache policy strongswan strongswan-starter xl2tpd ppp ==="
          apt-cache policy strongswan strongswan-starter xl2tpd ppp
          echo "=== apt-cache depends strongswan ==="
          apt-cache depends strongswan

          # candidate VERSION and its archive/component for package $1.
          cand_of() {
            apt-cache policy "$1" | awk '/Candidate:/ {print $2; exit}'
          }
          comp_of() {
            local c="$2"
            apt-cache policy "$1" | awk -v c="$c" '
              /Version table:/ { t = 1; next }
              t && ($1 == c || ($1 == "***" && $2 == c)) { g = 1; next }
              g && /:\/\// { print $3; exit }'
          }
          ss_cand="$(cand_of strongswan)"
          st_cand="$(cand_of strongswan-starter)"
          st_comp="(none)"
          [[ "$st_cand" == "(none)" || -z "$st_cand" ]] || st_comp="$(comp_of strongswan-starter "$st_cand")"
          ss_dep="(strongswan not available)"
          if [[ -n "$ss_cand" && "$ss_cand" != "(none)" ]]; then
            ss_show="$(apt-cache show "strongswan=${ss_cand}")"
            ss_dep="$(awk '/^Depends: / {sub(/^Depends: /, ""); print; exit}' <<<"$ss_show")"
          fi
          # Does installing ONLY the metapackage (apt defaults) pull in
          # strongswan-starter? Answered by apt's own resolver (simulation).
          sim="$(apt-get install -s strongswan 2>&1 || true)"
          if grep -qE '^Inst strongswan-starter( |$)' <<<"$sim"; then meta=Yes; else meta=No; fi
          echo "=== apt-get install -s strongswan: strongSwan/charon packages it would install ==="
          grep -E '^Inst (strongswan|charon|libcharon|libstrongswan)' <<<"$sim" || echo "(none)"
          {
            echo "OS_NAME='${PRETTY_NAME}'"
            echo "ST_CAND='${st_cand}'"
            echo "ST_COMP='${st_comp}'"
            echo "SS_DEP='${ss_dep}'"
            echo "META='${meta}'"
          } > "$ROW"
          echo "MATRIX ${{ matrix.image }}: strongswan-starter=${st_cand} [${st_comp}]  metapackage-pulls-starter=${meta}"
          echo "MATRIX ${{ matrix.image }}: strongswan Depends: ${ss_dep}"

      - name: "ubuntu:26.04 only: l2tp.sh refuses politely when universe is off"
        if: matrix.image == 'ubuntu:26.04'
        run: |
          set -euo pipefail
          # Must run BEFORE strongswan-starter is installed: an installed
          # package stays visible to apt-cache via the dpkg status file.
          src=/etc/apt/sources.list.d/ubuntu.sources
          [[ -f "$src" ]] || { echo "::error::$src not found; cannot toggle universe"; ls -la /etc/apt/sources.list.d; exit 1; }
          cp "$src" /tmp/ubuntu.sources.bak
          sed -i -E '/^Components:/s/[[:space:]]+universe\b//' "$src"
          grep -E '^Components:' "$src"
          if grep -E '^Components:' "$src" | grep -qw universe; then
            echo "::error::could not remove universe from $src"; exit 1
          fi
          rc=0
          out="$(bash tools/l2tp.sh preflight 2>&1)" || rc=$?
          printf '%s\n' "$out"
          echo "[l2tp] preflight exit code without universe: $rc"
          [[ "$rc" -ne 0 ]] \
              || { echo "::error::l2tp.sh preflight succeeded without universe (expected a refusal)"; exit 1; }
          grep -q "'universe' component is NOT enabled" <<<"$out" \
              || { echo "::error::refusal does not explain that universe is disabled"; exit 1; }
          grep -q 'add-apt-repository universe' <<<"$out" \
              || { echo "::error::refusal does not tell the user how to enable universe"; exit 1; }
          cp /tmp/ubuntu.sources.bak "$src"
          apt-get update
          echo "[l2tp] universe-off refusal: OK (non-zero exit + clear explanation); universe restored."

      - name: Install strongswan-starter xl2tpd ppp (explicit)
        id: install
        run: |
          set -euo pipefail
          # Explicit package list = tools/l2tp.sh L2TP_PACKAGES; iproute2 and
          # procps are test-harness tools (ip xfrm, pkill).
          if ! apt-get install -y strongswan-starter strongswan-charon xl2tpd ppp iproute2 procps; then
            echo "::error::${{ matrix.image }}: cannot install strongswan-starter/xl2tpd/ppp. If this release genuinely lacks strongswan-starter, mark it unsupported in README and keep l2tp.sh refusing there."
            exit 1
          fi
          dpkg-query -W -f='${Package} ${Version}\n' strongswan-starter strongswan-charon xl2tpd ppp

      - name: tools/l2tp.sh preflight (must accept this release)
        id: preflight
        run: bash tools/l2tp.sh preflight

      - name: Validate generated configs with the real starter + xl2tpd
        id: validate
        run: bash .github/scripts/l2tp-validate.sh

      - name: Matrix result
        if: always()
        run: |
          set -euo pipefail
          if [[ -f "$ROW" ]]; then
            # shellcheck disable=SC1090
            . "$ROW"
          fi
          line="| ${{ matrix.image }} | ${OS_NAME:-?} | ${ST_CAND:-?} | ${ST_COMP:-?} | ${META:-?} | install: ${{ steps.install.outcome }} / preflight: ${{ steps.preflight.outcome }} / validate: ${{ steps.validate.outcome }} |"
          echo "MATRIX-RESULT $line"
          echo "MATRIX-DEPENDS ${{ matrix.image }}: ${SS_DEP:-?}"
          {
            echo "| image | OS | strongswan-starter | archive/component | metapackage pulls starter? | steps |"
            echo "|---|---|---|---|---|---|"
            echo "$line"
            echo ""
            echo "\`strongswan\` Depends: \`${SS_DEP:-?}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  gre-dryrun:
    name: GRE dry-run + mirrored-address check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build side A and side B configs (both via print-config)
        run: |
          set -euo pipefail
          SIDES_DIR="$(mktemp -d)"
          bash tools/gre.sh print-config \
            --name vgre0 \
            --local 203.0.113.1 \
            --remote 203.0.113.2 \
            --inner-subnet 10.10.0.0/24 \
            > "$SIDES_DIR/sideA.txt"
          # Side B uses the same generator with swapped outer endpoints;
          # this avoids eval'ing the peer `add` command which requires root.
          bash tools/gre.sh print-config \
            --name vgre0 \
            --local 203.0.113.2 \
            --remote 203.0.113.1 \
            --inner-subnet 10.10.0.0/24 \
            > "$SIDES_DIR/sideB.txt"
          echo "--- side A ---"
          cat "$SIDES_DIR/sideA.txt"
          echo "--- side B ---"
          cat "$SIDES_DIR/sideB.txt"

          # arg_after KEYWORD PREFIX FILE: the token right after KEYWORD on
          # the single line of FILE starting with PREFIX. Keyword-based, so
          # it does not depend on word order (moving `mtu` before `type gre`
          # broke the old position/sed-based parser). Fails loudly when the
          # line or the keyword is missing instead of yielding "".
          arg_after() {
            local kw="$1" prefix="$2" file="$3" n val
            n="$(grep -c "^${prefix} " "$file" || true)"
            [[ "$n" -eq 1 ]] || {
              echo "::error::expected exactly one '${prefix}' line in ${file##*/}, got ${n}" >&2; return 1; }
            val="$(grep "^${prefix} " "$file" \
              | awk -v k="$kw" '{ for (i = 3; i < NF; i++) if ($i == k) { print $(i + 1); exit } }')"
            [[ -n "$val" ]] || {
              echo "::error::no '${kw}' option on the '${prefix}' line of ${file##*/}" >&2; return 1; }
            printf '%s\n' "$val"
          }

          a_local_inner="$(arg_after add  'ip addr add' "$SIDES_DIR/sideA.txt")"
          a_local_inner="${a_local_inner%/*}"
          a_remote_inner="$(arg_after peer 'ip addr add' "$SIDES_DIR/sideA.txt")"
          b_local_inner="$(arg_after add  'ip addr add' "$SIDES_DIR/sideB.txt")"
          b_local_inner="${b_local_inner%/*}"
          b_remote_inner="$(arg_after peer 'ip addr add' "$SIDES_DIR/sideB.txt")"
          echo "A inner: ${a_local_inner} <-> ${a_remote_inner}"
          echo "B inner: ${b_local_inner} <-> ${b_remote_inner}"
          [[ "$a_local_inner" == "$b_remote_inner" ]] \
              || { echo "::error::inner IPs are NOT mirrored (A local != B remote)"; exit 1; }
          [[ "$a_remote_inner" == "$b_local_inner" ]] \
              || { echo "::error::inner IPs are NOT mirrored (A remote != B local)"; exit 1; }

          a_outer_local="$(arg_after local  'ip link add' "$SIDES_DIR/sideA.txt")"
          a_outer_remote="$(arg_after remote 'ip link add' "$SIDES_DIR/sideA.txt")"
          b_outer_local="$(arg_after local  'ip link add' "$SIDES_DIR/sideB.txt")"
          b_outer_remote="$(arg_after remote 'ip link add' "$SIDES_DIR/sideB.txt")"
          echo "A outer: ${a_outer_local} -> ${a_outer_remote}"
          echo "B outer: ${b_outer_local} -> ${b_outer_remote}"
          # Absolute values, not just A==B: a parser returning the same
          # wrong token on both sides must not pass.
          [[ "$a_outer_local" == 203.0.113.1 && "$a_outer_remote" == 203.0.113.2 ]] \
              || { echo "::error::side A outer endpoints wrong: ${a_outer_local} -> ${a_outer_remote}"; exit 1; }
          [[ "$b_outer_local" == 203.0.113.2 && "$b_outer_remote" == 203.0.113.1 ]] \
              || { echo "::error::side B outer endpoints wrong: ${b_outer_local} -> ${b_outer_remote}"; exit 1; }

          a_mtu="$(arg_after mtu 'ip link add' "$SIDES_DIR/sideA.txt")"
          b_mtu="$(arg_after mtu 'ip link add' "$SIDES_DIR/sideB.txt")"
          echo "MTU: A=${a_mtu} B=${b_mtu}"
          [[ "$a_mtu" =~ ^[0-9]+$ && "$a_mtu" == "$b_mtu" ]] \
              || { echo "::error::MTU mismatch or not numeric: A=$a_mtu B=$b_mtu"; exit 1; }

          # Regression guard for the iproute2 syntax: link options (mtu)
          # must precede `type gre`; after `type` the gre parser rejects mtu.
          for side in sideA sideB; do
            [[ "$(arg_after type 'ip link add' "$SIDES_DIR/$side.txt")" == gre ]] \
                || { echo "::error::$side: ip link add is not 'type gre'"; exit 1; }
            grep '^ip link add ' "$SIDES_DIR/$side.txt" | awk '
              { for (i = 3; i <= NF; i++) { if ($i == "mtu") m = i; if ($i == "type") t = i } }
              END { exit !(m && t && m < t) }' \
                || { echo "::error::$side: 'mtu' must come before 'type gre' (ip-link(8) SYNOPSIS)"; exit 1; }
          done
          echo "ip link add word order: mtu before 'type gre' on both sides"

          grep -q 'gre-vgre0.service' "$SIDES_DIR/sideA.txt" \
              || { echo "::error::systemd unit name missing from side A"; exit 1; }
          grep -q 'gre-vgre0.service' "$SIDES_DIR/sideB.txt" \
              || { echo "::error::systemd unit name missing from side B"; exit 1; }

          echo "GRE dry-run PASSED: inner mirrors, outer swaps, MTU identical, mtu before type."
          rm -rf "$SIDES_DIR"

      - name: Reserved / over-long names rejected, default name is vgre0
        run: |
          set -euo pipefail
          for bad in gre0 gretap0 erspan0 abcdefghijklmnop; do
            if out="$(bash tools/gre.sh print-config --name "$bad" \
                --local 203.0.113.1 --remote 203.0.113.2 2>&1)"; then
              echo "::error::--name $bad was accepted"; printf '%s\n' "$out"; exit 1
            fi
            msg="$(printf '%s\n' "$out" | grep -m1 -iE 'reserved|invalid' || true)"
            [[ -n "$msg" ]] \
                || { echo "::error::--name $bad failed without a clear error"; printf '%s\n' "$out"; exit 1; }
            echo "--name $bad rejected: $msg"
          done
          default_out="$(GRE_CONF_DIR="$(mktemp -d)" bash tools/gre.sh print-config \
              --local 203.0.113.1 --remote 203.0.113.2)"
          printf '%s\n' "$default_out" | grep '^ip link add '
          printf '%s\n' "$default_out" | grep -q '^ip link add vgre0 ' \
              || { echo "::error::default tunnel name is not vgre0"; exit 1; }
          echo "default tunnel name: vgre0 OK"

  gre-functional:
    name: GRE functional test (netns + ping)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check ip_gre availability
        id: gre-check
        run: |
          # modprobe needs root: without sudo it fails for every user even
          # when the module exists, which would turn every run into a skip.
          echo "kernel: $(uname -r)"
          if sudo modprobe ip_gre 2>&1; then
            echo "ip_gre loaded (built-in or module present)."
            lsmod | grep -E '^ip_gre' || echo "(ip_gre not in lsmod: built-in)"
            echo "can_test=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ip_gre not currently loadable; installing linux-modules-extra ..."
          sudo apt-get update
          sudo apt-get install -y "linux-modules-extra-$(uname -r)" || true
          if sudo modprobe ip_gre 2>&1; then
            echo "ip_gre loaded after installing linux-modules-extra."
            echo "can_test=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::warning title=GRE functional test SKIPPED::ip_gre cannot be loaded on this runner (kernel $(uname -r)); the netns + ping test did NOT run."
          echo "can_test=false" >> "$GITHUB_OUTPUT"
          {
            echo "### GRE functional test: SKIPPED"
            echo ""
            echo "ip_gre could not be loaded on kernel \`$(uname -r)\` (no matching linux-modules-extra package)."
            echo "The netns + ping test did **not** run; a green job here does not mean GRE was tested end-to-end."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build a GRE tunnel across two netns and ping
        if: steps.gre-check.outputs.can_test == 'true'
        run: |
          set -euo pipefail
          SIDES_DIR="$(mktemp -d)"
          sudo ip netns add gre-test-a
          sudo ip netns add gre-test-b
          sudo ip link add veth-a type veth peer name veth-b
          sudo ip link set veth-a netns gre-test-a
          sudo ip link set veth-b netns gre-test-b
          sudo ip netns exec gre-test-a ip addr add 203.0.113.1/30 dev veth-a
          sudo ip netns exec gre-test-b ip addr add 203.0.113.2/30 dev veth-b
          sudo ip netns exec gre-test-a ip link set veth-a up
          sudo ip netns exec gre-test-b ip link set veth-b up
          sudo ip netns exec gre-test-a ip link set lo up
          sudo ip netns exec gre-test-b ip link set lo up

          # Side A: generate via print-config, run the emitted ip commands.
          bash tools/gre.sh print-config \
            --name vgre0 \
            --local 203.0.113.1 \
            --remote 203.0.113.2 \
            --inner-subnet 10.10.0.0/24 \
            > "$SIDES_DIR/sideA.txt"
          echo "--- side A ---"
          cat "$SIDES_DIR/sideA.txt"
          side_a_cmds="$(grep -E '^ip (link|addr)' "$SIDES_DIR/sideA.txt")"
          # set -e inside: a rejected `ip` command must fail the job, not be
          # silently ignored (that is how the previous run hid a bad
          # `ip link add` line and then pinged via the kernel's gre0).
          sudo ip netns exec gre-test-a bash -euo pipefail -c "$side_a_cmds" \
              || { echo "::error::side A ip commands failed"; exit 1; }

          # Side B: same generator with swapped outer endpoints.
          bash tools/gre.sh print-config \
            --name vgre0 \
            --local 203.0.113.2 \
            --remote 203.0.113.1 \
            --inner-subnet 10.10.0.0/24 \
            > "$SIDES_DIR/sideB.txt"
          echo "--- side B ---"
          cat "$SIDES_DIR/sideB.txt"
          side_b_cmds="$(grep -E '^ip (link|addr)' "$SIDES_DIR/sideB.txt")"
          sudo ip netns exec gre-test-b bash -euo pipefail -c "$side_b_cmds" \
              || { echo "::error::side B ip commands failed"; exit 1; }
          echo "--- vgre0 link details ---"
          sudo ip netns exec gre-test-a ip -d link show vgre0
          sudo ip netns exec gre-test-b ip -d link show vgre0

          # Verify symmetric inner addresses.
          a_inner="$(sudo ip netns exec gre-test-a ip -4 addr show vgre0 2>/dev/null \
              | awk '/inet /{print $2}' | head -n1 || true)"
          b_inner="$(sudo ip netns exec gre-test-b ip -4 addr show vgre0 2>/dev/null \
              | awk '/inet /{print $2}' | head -n1 || true)"
          echo "A inner: $a_inner"
          echo "B inner: $b_inner"
          [[ -n "$a_inner" && -n "$b_inner" ]] \
              || { echo "::error::could not determine inner addresses"; exit 1; }
          [[ "$a_inner" != "$b_inner" ]] \
              || { echo "::error::inner addresses are identical (pairing broken)"; exit 1; }

          # Ping both directions.
          echo "--- ping A -> B ---"
          if sudo ip netns exec gre-test-a ping -c 2 -W 2 -I vgre0 "${b_inner%/*}"; then
            echo "ping A->B: OK"
          else
            echo "::error::ping A->B failed"
            exit 1
          fi
          echo "--- ping B -> A ---"
          if sudo ip netns exec gre-test-b ping -c 2 -W 2 -I vgre0 "${a_inner%/*}"; then
            echo "ping B->A: OK"
          else
            echo "::error::ping B->A failed"
            exit 1
          fi

          # Cleanup netns.
          sudo ip netns del gre-test-a 2>/dev/null || true
          sudo ip netns del gre-test-b 2>/dev/null || true
          echo "GRE functional test PASSED."
          echo "### GRE functional test: RAN and PASSED (ping A<->B over vgre0)" >> "$GITHUB_STEP_SUMMARY"
          rm -rf "$SIDES_DIR"

  gre-multiple:
    name: GRE multiple tunnels (collision avoidance)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Two independent pairs must pick disjoint /30s
        run: |
          set -euo pipefail
          D1="$(mktemp -d)"
          D2="$(mktemp -d)"
          # Use a shared temp CONF_DIR so collision detection works across invocations.
          TEMP_CONF="$(mktemp -d)"
          export GRE_CONF_DIR="$TEMP_CONF"
          bash tools/gre.sh print-config \
            --name vgre0 --local 203.0.113.1 --remote 203.0.113.2 \
            --inner-subnet 10.10.0.0/24 > "$D1/a.txt"
          # Side B via print-config (not eval) to avoid root requirement
          bash tools/gre.sh print-config \
            --name vgre0 --local 203.0.113.2 --remote 203.0.113.1 \
            --inner-subnet 10.10.0.0/24 > "$D1/b.txt"
          # Simulate vgre0 being installed: write its config so vgre1 sees it.
          printf '%s\n' \
            'NAME=vgre0' \
            'LOCAL_IP=203.0.113.1' \
            'REMOTE_IP=203.0.113.2' \
            'INNER_SUBNET=10.10.0.0/24' \
            'LOCAL_INNER=10.10.0.1' \
            'REMOTE_INNER=10.10.0.2' \
            'GRE_KEY=' \
            'GRE_TTL=' \
            'MTU=1476' \
            'FORWARDING=1' \
            > "$TEMP_CONF/vgre0.conf"
          bash tools/gre.sh print-config \
            --name vgre1 --local 203.0.114.1 --remote 203.0.114.2 \
            --inner-subnet 10.10.0.0/24 > "$D2/a.txt"
          bash tools/gre.sh print-config \
            --name vgre1 --local 203.0.114.2 --remote 203.0.114.1 \
            --inner-subnet 10.10.0.0/24 > "$D2/b.txt"

          inner1_a="$(grep '^ip addr add' "$D1/a.txt" | awk '{print $4}' | cut -d/ -f1)"
          inner1_b="$(grep '^ip addr add' "$D1/a.txt" | awk '{print $6}')"
          inner2_a="$(grep '^ip addr add' "$D2/a.txt" | awk '{print $4}' | cut -d/ -f1)"
          inner2_b="$(grep '^ip addr add' "$D2/a.txt" | awk '{print $6}')"
          echo "Pair 1: ${inner1_a} <-> ${inner1_b}"
          echo "Pair 2: ${inner2_a} <-> ${inner2_b}"
          for pair in "$inner1_a" "$inner1_b" "$inner2_a" "$inner2_b"; do
            count="$(printf '%s\n%s\n%s\n%s\n' \
                "$inner1_a" "$inner1_b" "$inner2_a" "$inner2_b" \
                | sort | uniq -c | awk -v ip="$pair" '$2==ip{print $1}')"
            [[ "${count:-0}" -eq 1 ]] \
                || { echo "::error::address collision detected: $pair used more than once"; exit 1; }
          done
          echo "GRE multiple-tunnel test PASSED: no address collisions."
          rm -rf "$D1" "$D2"

  gre-ufw:
    name: GRE ufw rule add/remove (allow_gre_firewall + remove_gre_firewall)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install + bootstrap ufw for test harness
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ufw
          # Reset is required because GitHub Actions caches `/etc/ufw`
          # between jobs; `enable` makes the runtime table visible so
          # status/added inspections land on actual state, not just
          # persisted rules that never got loaded.
          sudo ufw --force reset
          sudo ufw default deny incoming
          sudo ufw default allow outgoing
          sudo ufw --force enable
          # Diagnostic: confirm the firewall is actually active before testing.
          sudo ufw status verbose | head -5
          echo "ufw bootstrapped OK."

      - name: Exercise gre.sh allow_gre_firewall + remove_gre_firewall (one sudo pass)
        run: |
          set -euo pipefail
          REMOTE="203.0.113.9"
          GWS="$GITHUB_WORKSPACE"
          sudo ip link del vgre0 2>/dev/null || true   # ensure clean slate
          # Write the test harness to a temp file on the runner so sudo bash can
          # source it cleanly without having to dodge bash -c quoting layers.
          cat > /tmp/_gre_ufw_test.sh <<'INNER'
            #!/usr/bin/env bash
            set -euo pipefail
            REMOTE="${1:-203.0.113.9}"
            GWS="${2:-.}"
            REMOTE_IP="$REMOTE"
            source "${GWS}/tools/gre.sh"
            echo "[test] REMOTE_IP=$REMOTE_IP"
            # --- Add: fire the exact function the real tool uses for the ufw path ---
            allow_gre_firewall
            echo "[test] add done"
            ufw_status="$(sudo ufw status verbose 2>/dev/null || true)"
            ufw_added="$(sudo ufw show added 2>/dev/null || true)"
            echo "--- ufw status verbose ---"
            echo "$ufw_status"
            echo "--- ufw show added ---"
            echo "$ufw_added"
            if ! echo "$ufw_added" | grep -qi 'proto gre'; then
              echo "::error::proto-gre rule not present in ufw after add"
              exit 1
            fi
            echo "[test] add verified: proto gre rule present"
            # --- Remove: the tool's own removal function (shared by
            # remove_tunnel and uninstall). No `|| true`: under set -e a
            # failing removal fails the job.
            remove_gre_firewall "$REMOTE_IP"
            echo "[test] remove_gre_firewall done"
            ufw_after="$(sudo ufw status verbose 2>/dev/null || true)"
            added_after="$(sudo ufw show added 2>/dev/null || true)"
            echo "--- ufw status verbose after remove ---"
            echo "$ufw_after"
            echo "--- ufw show added after remove ---"
            echo "$added_after"
            if echo "$ufw_after" | grep -qE 'proto gre'; then
              echo "::error::ufw rule still present after remove"
              exit 1
            fi
            if echo "$added_after" | grep -qE 'proto gre'; then
              echo "::error::ufw recorded rule still present after remove"
              exit 1
            fi
            echo "[test] GRE ufw rule add/remove PASSED"
          INNER
          chmod +x /tmp/_gre_ufw_test.sh
          sudo REMOTE="$REMOTE" bash /tmp/_gre_ufw_test.sh "$REMOTE" "$GWS"
      - name: Clean up gre state after test
        if: always()
        run: |
          set -euo pipefail
          sudo rm -rf /etc/gre-tunnels
          sudo rm -f /etc/systemd/system/gre-*.service
          sudo systemctl daemon-reload 2>/dev/null || true
          sudo rm -f /etc/sysctl.d/90-gre.conf /etc/modules-load.d/gre.conf
