name: shellcheck

on:
  push:
    paths:
      - '**.sh'
      - '**.yml'
      - '**.yaml'
      - '.github/workflows/**'
  pull_request:
    paths:
      - '**.sh'
      - '**.yml'
      - '**.yaml'
      - '.github/workflows/**'

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run ShellCheck on our own scripts (strict)
        run: shellcheck main.sh install_openvpn.sh tools/*.sh

      - name: Run ShellCheck on wireguard-install.sh (error only)
        run: shellcheck --severity=error wireguard-install.sh

  config-test:
    name: Config validation (ocserv)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install ocserv
        run: |
          sudo apt-get update
          sudo apt-get install -y ocserv

      - name: Validate generated ocserv config with ocserv --test-config
        run: |
          bash tools/ocserv.sh print-config > /tmp/ocserv-test.conf
          echo "--- generated ocserv.conf ---"
          cat /tmp/ocserv-test.conf
          sudo mkdir -p /etc/ocserv/ssl
          sudo openssl req -x509 -nodes -newkey rsa-2048 -days 30 \
            -keyout /etc/ocserv/ssl/server-key.pem \
            -out  /etc/ocserv/ssl/server-cert.pem \
            -subj "/CN=vpn.local"
          sudo touch /etc/ocserv/ocpasswd
          sudo mkdir -p /run
          set -o pipefail
          rc=0
          out="$(sudo ocserv -c /tmp/ocserv-test.conf --test-config 2>&1)" || rc=$?
          echo "$out"
          if [[ "$rc" -ne 0 ]]; then
            echo "::error::ocserv --test-config exited with code $rc"
            exit 1
          fi
          if echo "$out" | grep -qi 'unknown option'; then
            echo "::error::ocserv --test-config reported an unknown option"
            exit 1
          fi
          echo "ocserv config validated (exit 0, no unknown options)."

  pptp-dryrun:
    name: PPTP dry-run + availability check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check pptpd availability on this release
        run: |
          bash tools/pptp.sh print-config | tee /tmp/pptp-dryrun.txt
          grep -q 'option /etc/ppp/pptpd-options' /tmp/pptp-dryrun.txt \
            || { echo "::error::pptpd.conf missing the option directive"; exit 1; }
          grep -q 'require-mppe-128' /tmp/pptp-dryrun.txt \
            || { echo "::error::ppp options missing require-mppe-128"; exit 1; }
          grep -q 'require-mschap-v2' /tmp/pptp-dryrun.txt \
            || { echo "::error::ppp options missing require-mschap-v2"; exit 1; }
          grep -q 'localip' /tmp/pptp-dryrun.txt \
            || { echo "::error::pptpd.conf missing localip"; exit 1; }
          if apt-cache show pptpd >/dev/null 2>&1; then
            echo "pptpd is available on this release."
          else
            echo "::warning::pptpd is not available on this release (expected on Ubuntu 24.04+)."
            echo "The install path will refuse on this release; print-config still validated."
          fi
          echo "PPTP print-config validated."

  l2tp-validate:
    name: L2TP/IPsec config validator (real software)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install strongSwan + xl2tpd + ppp
        run: |
          sudo apt-get update
          sudo apt-get install -y strongswan xl2tpd ppp

      - name: Generate and validate L2TP configs
        run: |
          set -uo pipefail
          bash tools/l2tp.sh print-config \
            --public-ip 203.0.113.9 \
            --psk 'TestPSK123456789012345' \
            > /tmp/l2tp-dryrun.txt
          echo "--- generated L2TP configs ---"
          cat /tmp/l2tp-dryrun.txt

          awk '/^--- \/etc\/ipsec\.conf$/{f=1;next} /^--- /{f=0} f{print}' /tmp/l2tp-dryrun.txt \
              | sudo tee /etc/ipsec.conf >/dev/null
          awk '/^--- \/etc\/ipsec\.secrets$/{f=1;next} /^--- /{f=0} f{print}' /tmp/l2tp-dryrun.txt \
              | sudo tee /etc/ipsec.secrets >/dev/null
          sudo chmod 640 /etc/ipsec.secrets
          awk '/^--- \/etc\/xl2tpd\/xl2tpd\.conf$/{f=1;next} /^--- /{f=0} f{print}' /tmp/l2tp-dryrun.txt \
              | sudo tee /etc/xl2tpd/xl2tpd.conf >/dev/null
          awk '/^--- \/etc\/ppp\/options\.xl2tpd$/{f=1;next} /^--- /{f=0} f{print}' /tmp/l2tp-dryrun.txt \
              | sudo tee /etc/ppp/options.xl2tpd >/dev/null

           echo "=== strongSwan starter output ==="
           rc=0
           # Use timeout to prevent hanging on valid config; exit code 124 = healthy daemon
           starter_out="$(timeout 10 sudo /usr/lib/ipsec/starter --nofork 2>&1)" || rc=$?
           echo "$starter_out"
           if [[ "$rc" -eq 124 ]]; then
             echo "strongSwan starter ran for 10s without crashing (likely healthy)."
           elif [[ "$rc" -ne 0 ]]; then
             echo "::error::strongSwan starter failed (exit $rc); see above output"
             exit 1
           fi
           if echo "$starter_out" | grep -iqE 'unknown keyword|parsing error'; then
             echo "::error::strongSwan starter reported unknown keywords or parsing errors"
             exit 1
           fi
           echo "strongSwan starter: OK."

          echo "=== xl2tpd startup check ==="
          sudo rm -f /var/run/xl2tpd/l2tp-control
          sudo mkdir -p /var/run/xl2tpd
          xl2tpd_out="$(timeout 3 xl2tpd -D -c /etc/xl2tpd/xl2tpd.conf -C /var/run/xl2tpd/l2tp-control 2>&1 || true)"
          echo "${xl2tpd_out:-(no output)}"
          if echo "${xl2tpd_out:-}" | grep -iqE 'parse_config:|Unable to load config file'; then
            echo "::error::xl2tpd rejected the generated config"
            exit 1
          fi
          echo "xl2tpd startup: OK (no parse_config / Unable-to-load errors)."

          echo "L2TP/IPsec config validated by real strongSwan + xl2tpd."

  gre-dryrun:
    name: GRE dry-run + mirrored-address check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build side A and side B configs (both via print-config)
        run: |
          set -uo pipefail
          SIDES_DIR="$(mktemp -d)"
          bash tools/gre.sh print-config \
            --name gre0 \
            --local 203.0.113.1 \
            --remote 203.0.113.2 \
            --inner-subnet 10.10.0.0/24 \
            > "$SIDES_DIR/sideA.txt"
          # Side B uses the same generator with swapped outer endpoints;
          # this avoids eval'ing the peer `add` command which requires root.
          bash tools/gre.sh print-config \
            --name gre0 \
            --local 203.0.113.2 \
            --remote 203.0.113.1 \
            --inner-subnet 10.10.0.0/24 \
            > "$SIDES_DIR/sideB.txt"
          echo "--- side A ---"
          cat "$SIDES_DIR/sideA.txt"
          echo "--- side B ---"
          cat "$SIDES_DIR/sideB.txt"

          a_local_inner="$(grep '^ip addr add' "$SIDES_DIR/sideA.txt" \
              | awk '{print $4}' | cut -d/ -f1 || true)"
          a_remote_inner="$(grep '^ip addr add' "$SIDES_DIR/sideA.txt" \
              | awk '{print $6}' || true)"
          b_local_inner="$(grep '^ip addr add' "$SIDES_DIR/sideB.txt" \
              | awk '{print $4}' | cut -d/ -f1 || true)"
          b_remote_inner="$(grep '^ip addr add' "$SIDES_DIR/sideB.txt" \
              | awk '{print $6}' || true)"
          echo "A inner: ${a_local_inner} <-> ${a_remote_inner}"
          echo "B inner: ${b_local_inner} <-> ${b_remote_inner}"
          [[ "$a_local_inner" == "$b_remote_inner" ]] \
              || { echo "::error::inner IPs are NOT mirrored (A local != B remote)"; exit 1; }
          [[ "$a_remote_inner" == "$b_local_inner" ]] \
              || { echo "::error::inner IPs are NOT mirrored (A remote != B local)"; exit 1; }

          a_outer_local="$(grep '^ip link add' "$SIDES_DIR/sideA.txt" \
              | sed -n 's/.*local \([^ ]*\) remote.*/\1/p' || true)"
          a_outer_remote="$(grep '^ip link add' "$SIDES_DIR/sideA.txt" \
              | sed -n 's/.*remote \([^ ]*\) .*/\1/p' || true)"
          b_outer_local="$(grep '^ip link add' "$SIDES_DIR/sideB.txt" \
              | sed -n 's/.*local \([^ ]*\) remote.*/\1/p' || true)"
          b_outer_remote="$(grep '^ip link add' "$SIDES_DIR/sideB.txt" \
              | sed -n 's/.*remote \([^ ]*\) .*/\1/p' || true)"
          echo "A outer: ${a_outer_local} -> ${a_outer_remote}"
          echo "B outer: ${b_outer_local} -> ${b_outer_remote}"
          [[ "$a_outer_local" == "$b_outer_remote" ]] \
              || { echo "::error::outer local IPs do not match"; exit 1; }
          [[ "$a_outer_remote" == "$b_outer_local" ]] \
              || { echo "::error::outer remote IPs do not match"; exit 1; }

          a_mtu="$(grep '^ip link add' "$SIDES_DIR/sideA.txt" \
              | sed -n 's/.*mtu \([0-9]*\).*/\1/p' || true)"
          b_mtu="$(grep '^ip link add' "$SIDES_DIR/sideB.txt" \
              | sed -n 's/.*mtu \([0-9]*\).*/\1/p' || true)"
          [[ "$a_mtu" == "$b_mtu" ]] \
              || { echo "::error::MTU mismatch: A=$a_mtu B=$b_mtu"; exit 1; }

          grep -q 'gre-gre0.service' "$SIDES_DIR/sideA.txt" \
              || { echo "::error::systemd unit name missing from side A"; exit 1; }
          grep -q 'gre-gre0.service' "$SIDES_DIR/sideB.txt" \
              || { echo "::error::systemd unit name missing from side B"; exit 1; }

          echo "GRE dry-run PASSED: inner mirrors, outer swaps, MTU identical."
          rm -rf "$SIDES_DIR"

  gre-functional:
    name: GRE functional test (netns + ping)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check ip_gre availability
        id: gre-check
        run: |
          if modprobe ip_gre 2>/dev/null; then
            echo "ip_gre loaded (built-in or module present)."
            echo "can_test=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ip_gre not currently loadable; installing linux-modules-extra ..."
          sudo apt-get update
          sudo apt-get install -y linux-modules-extra-$(uname -r) || true
          if modprobe ip_gre 2>/dev/null; then
            echo "ip_gre loaded after installing linux-modules-extra."
            echo "can_test=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::warning::ip_gre cannot be loaded even after installing linux-modules-extra."
          echo "Skipping the functional netns test; the dry-run job validates address mirroring."
          echo "can_test=false" >> "$GITHUB_OUTPUT"

      - name: Build a GRE tunnel across two netns and ping
        if: steps.gre-check.outputs.can_test == 'true'
        run: |
          set -uo pipefail
          SIDES_DIR="$(mktemp -d)"
          sudo ip netns add gre-test-a
          sudo ip netns add gre-test-b
          sudo ip link add veth-a type veth peer name veth-b
          sudo ip link set veth-a netns gre-test-a
          sudo ip link set veth-b netns gre-test-b
          sudo ip netns exec gre-test-a ip addr add 203.0.113.1/30 dev veth-a
          sudo ip netns exec gre-test-b ip addr add 203.0.113.2/30 dev veth-b
          sudo ip netns exec gre-test-a ip link set veth-a up
          sudo ip netns exec gre-test-b ip link set veth-b up
          sudo ip netns exec gre-test-a ip link set lo up
          sudo ip netns exec gre-test-b ip link set lo up

          # Side A: generate via print-config, run the emitted ip commands.
          bash tools/gre.sh print-config \
            --name gre0 \
            --local 203.0.113.1 \
            --remote 203.0.113.2 \
            --inner-subnet 10.10.0.0/24 \
            > "$SIDES_DIR/sideA.txt"
          echo "--- side A ---"
          cat "$SIDES_DIR/sideA.txt"
          side_a_cmds="$(grep -E '^ip (link|addr)' "$SIDES_DIR/sideA.txt")"
          sudo ip netns exec gre-test-a bash -c "$side_a_cmds"

          # Side B: same generator with swapped outer endpoints.
          bash tools/gre.sh print-config \
            --name gre0 \
            --local 203.0.113.2 \
            --remote 203.0.113.1 \
            --inner-subnet 10.10.0.0/24 \
            > "$SIDES_DIR/sideB.txt"
          echo "--- side B ---"
          cat "$SIDES_DIR/sideB.txt"
          side_b_cmds="$(grep -E '^ip (link|addr)' "$SIDES_DIR/sideB.txt")"
          sudo ip netns exec gre-test-b bash -c "$side_b_cmds"

          # Verify symmetric inner addresses.
          a_inner="$(sudo ip netns exec gre-test-a ip -4 addr show gre0 2>/dev/null \
              | awk '/inet /{print $2}' | head -n1 || true)"
          b_inner="$(sudo ip netns exec gre-test-b ip -4 addr show gre0 2>/dev/null \
              | awk '/inet /{print $2}' | head -n1 || true)"
          echo "A inner: $a_inner"
          echo "B inner: $b_inner"
          [[ -n "$a_inner" && -n "$b_inner" ]] \
              || { echo "::error::could not determine inner addresses"; exit 1; }
          [[ "$a_inner" != "$b_inner" ]] \
              || { echo "::error::inner addresses are identical (pairing broken)"; exit 1; }

          # Ping both directions.
          echo "--- ping A -> B ---"
          if sudo ip netns exec gre-test-a ping -c 2 -W 2 "${b_inner%/*}" >/dev/null 2>&1; then
            echo "ping A->B: OK"
          else
            echo "::error::ping A->B failed"
            exit 1
          fi
          echo "--- ping B -> A ---"
          if sudo ip netns exec gre-test-b ping -c 2 -W 2 "${a_inner%/*}" >/dev/null 2>&1; then
            echo "ping B->A: OK"
          else
            echo "::error::ping B->A failed"
            exit 1
          fi

          # Cleanup netns.
          sudo ip netns del gre-test-a 2>/dev/null || true
          sudo ip netns del gre-test-b 2>/dev/null || true
          echo "GRE functional test PASSED."
          rm -rf "$SIDES_DIR"

  gre-multiple:
    name: GRE multiple tunnels (collision avoidance)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Two independent pairs must pick disjoint /30s
        run: |
          set -uo pipefail
          D1="$(mktemp -d)"
          D2="$(mktemp -d)"
          # Use a shared temp CONF_DIR so collision detection works across invocations.
          TEMP_CONF="$(mktemp -d)"
          export GRE_CONF_DIR="$TEMP_CONF"
          bash tools/gre.sh print-config \
            --name gre0 --local 203.0.113.1 --remote 203.0.113.2 \
            --inner-subnet 10.10.0.0/24 > "$D1/a.txt"
          # Side B via print-config (not eval) to avoid root requirement
          bash tools/gre.sh print-config \
            --name gre0 --local 203.0.113.2 --remote 203.0.113.1 \
            --inner-subnet 10.10.0.0/24 > "$D1/b.txt"
          # Simulate gre0 being installed: write its config so gre1 sees it.
          printf '%s\n' \
            'NAME=gre0' \
            'LOCAL_IP=203.0.113.1' \
            'REMOTE_IP=203.0.113.2' \
            'INNER_SUBNET=10.10.0.0/24' \
            'LOCAL_INNER=10.10.0.1' \
            'REMOTE_INNER=10.10.0.2' \
            'GRE_KEY=' \
            'GRE_TTL=' \
            'MTU=1476' \
            'FORWARDING=1' \
            > "$TEMP_CONF/gre0.conf"
          bash tools/gre.sh print-config \
            --name gre1 --local 203.0.114.1 --remote 203.0.114.2 \
            --inner-subnet 10.10.0.0/24 > "$D2/a.txt"
          bash tools/gre.sh print-config \
            --name gre1 --local 203.0.114.2 --remote 203.0.114.1 \
            --inner-subnet 10.10.0.0/24 > "$D2/b.txt"

          inner1_a="$(grep '^ip addr add' "$D1/a.txt" | awk '{print $4}' | cut -d/ -f1)"
          inner1_b="$(grep '^ip addr add' "$D1/a.txt" | awk '{print $6}')"
          inner2_a="$(grep '^ip addr add' "$D2/a.txt" | awk '{print $4}' | cut -d/ -f1)"
          inner2_b="$(grep '^ip addr add' "$D2/a.txt" | awk '{print $6}')"
          echo "Pair 1: ${inner1_a} <-> ${inner1_b}"
          echo "Pair 2: ${inner2_a} <-> ${inner2_b}"
          for pair in "$inner1_a" "$inner1_b" "$inner2_a" "$inner2_b"; do
            count="$(printf '%s\n%s\n%s\n%s\n' \
                "$inner1_a" "$inner1_b" "$inner2_a" "$inner2_b" \
                | sort | uniq -c | awk -v ip="$pair" '$2==ip{print $1}')"
            [[ "${count:-0}" -eq 1 ]] \
                || { echo "::error::address collision detected: $pair used more than once"; exit 1; }
          done
          echo "GRE multiple-tunnel test PASSED: no address collisions."
          rm -rf "$D1" "$D2"

  gre-ufw:
    name: GRE ufw rule add/remove (via tool, not hand-written rules)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install + bootstrap ufw for test harness
        run: |
          set -eo pipefail
          sudo apt-get update
          sudo apt-get install -y ufw
          # Reset is required because GitHub Actions caches `/etc/ufw`
          # between jobs; `enable` makes the runtime table visible so
          # status/added inspections land on actual state, not just
          # persisted rules that never got loaded.
          sudo ufw --force reset
          sudo ufw default deny incoming
          sudo ufw default allow outgoing
          sudo ufw --force enable
          # Diagnostic: confirm the firewall is actually active before testing.
          sudo ufw status verbose | head -5
          echo "ufw bootstrapped OK."

      - name: Source gre.sh and exercise allow_gre_firewall (add)
        run: |
          set -eo pipefail
          REMOTE="203.0.113.9"
          TEST_STATE="$(mktemp -d)"
          trap 'rm -rf -- "$TEST_STATE"' EXIT
          # Override gre.sh's default state dirs so sourcing stays safe
          # (no attempt to mkdir /etc/gre-tunnels etc. as unprivileged user).
          export GRE_CONF_DIR="$TEST_STATE" \
                 GRE_UNIT_DIR="$TEST_STATE/units" \
                 SYSCTL="$TEST_STATE/sysctl.conf" \
                 MODULES="$TEST_STATE/modules-load.d"
          # Write a small helper script we can hand to sudo.
          # Using a file sidesteps quoting/heredoc issues with sudo+bash.
          cat > /tmp/_gre_test_add.sh <<'INNER'
            set -euo pipefail
            REMOTE="${REMOTE:-203.0.113.9}"
            REMOTE_IP="${REMOTE}"
            source tools/gre.sh
            allow_gre_firewall
            exec >/tmp/gre-allow-out.txt
            ufw status verbose
            ufw status numbered
            ufw show added
          INNER
          chmod +x /tmp/_gre_test_add.sh
          sudo REMOTE="$REMOTE" bash /tmp/_gre_test_add.sh
          # Dump the captured output for diagnostics.
          cat /tmp/gre-allow-out.txt
          # Check that ufw accepted the rule — verbose output may vary by release.
          if ! grep -qi 'proto gre' /tmp/gre-allow-out.txt; then
            echo "::error::no proto-gre entry found in ufw output" >&2
            cat /tmp/gre-allow-out.txt >&2
            exit 1
          fi
          echo "GRE allow: ufw rule installed successfully."

      - name: Source gre.sh and exercise remove path (remove)
        run: |
          set -eo pipefail
          REMOTE="203.0.113.9"
          TEST_STATE="$(mktemp -d)"
          trap 'rm -rf -- "$TEST_STATE"' EXIT
          export GRE_CONF_DIR="$TEST_STATE" \
                 GRE_UNIT_DIR="$TEST_STATE/units" \
                 SYSCTL="$TEST_STATE/sysctl.conf" \
                 MODULES="$TEST_STATE/modules-load.d"
          sudo env "REMOTE=${REMOTE}" bash <<'BASH'
            set -euo pipefail
            REMOTE="${REMOTE}"
            REMOTE_IP="${REMOTE}"
            source tools/gre.sh
            remove_tunnel "gre0" >/tmp/remove-gre.log 2>&1 || true
            echo "--- gre.sh remove log ---"
            cat /tmp/remove-gre.log || true
            echo "--- ufw status after remove ---"
            ufw status verbose
            # Rule must have been removed from both tables.
            ufw status verbose | grep -qE 'proto gre' \
                && { echo "::error::ufw rule still present after remove"; exit 1; }
            ufw show added | grep -qE 'proto gre' \
                && { echo "::error::ufw recorded rule still present after remove"; exit 1; }
            echo "GRE remove: ufw rule cleaned up successfully."
          BASH
